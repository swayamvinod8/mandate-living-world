name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Pages is static hosting, so the server-only recap route can't ship
      - name: Remove server routes
        run: rm -rf app/api

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_PROGRAM_ID: H3tueXv6DLBhn61SzEuy3MueqGwhQfkM5yK2gyHsZDjd
          NEXT_PUBLIC_NPC_AUTHORITY: ViP2DvBqbqfkSSs5Sf5vSrFffb2LbmgwXsZz9PeSxHb
          NEXT_PUBLIC_RECAP_MODE: local
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
